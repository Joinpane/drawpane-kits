# Daily: Penpot's hub, read again from Penpot's own data (penpot/penpot-files
# and the hub's pages) into sources/penpot.json, and index.json rebuilt.
# Commits only when something changed.
name: Penpot hub
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: penpot-hub
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run penpot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run index
      - run: npm run validate
      - name: Commit if changed
        run: |
          if git diff --quiet -- sources index.json; then
            echo "Penpot's hub hasn't changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sources index.json
          git commit -m "Penpot hub: refresh listing"
          git push
